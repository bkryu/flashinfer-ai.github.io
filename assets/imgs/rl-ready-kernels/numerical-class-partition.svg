   <g id="text_1">
    <text style="font-weight: 700; font-size: 28.5px; font-family: 'DejaVu Sans'; fill: #24312b" transform="translate(37.404 37.46833)">Choose the Numerical Class</text>
    <text style="font-weight: 700; font-size: 28.5px; font-family: 'DejaVu Sans'; fill: #24312b" transform="translate(37.404 71.676123)">from the Fixed Weight Shape</text>
   </g>
   <g id="text_2">
    <text style="font-size: 18.75px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #617069" x="37.404" y="102.405723" transform="rotate(-0 37.404 102.405723)">Schematic N/K partition for one format and architecture; M is not a class-selection axis.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312b" x="301.05" y="589.888923" transform="rotate(-0 301.05 589.888923)">N · output columns →</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #24312b" transform="translate(42.080484 492.017467) rotate(-90)">K · reduction length →</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 20.25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a56300" x="205.02" y="271.418523" transform="rotate(-0 205.02 271.418523)">Ordered chunk fold</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a56300" x="184.068" y="301.449723" transform="rotate(-0 184.068 301.449723)">C(N, K, format) &gt; 1</text>
   </g>
   <g id="text_7">
    <text style="font-size: 17.25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #617069" x="184.068" y="330.084123" transform="rotate(-0 184.068 330.084123)">narrow N, long K</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 20.25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563eb" x="351.684" y="488.620923" transform="rotate(-0 351.684 488.620923)">Uninterrupted K fold</text>
   </g>
   <g id="text_9">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563eb" x="351.684" y="518.652123" transform="rotate(-0 351.684 518.652123)">C = 1</text>
   </g>
   <g id="text_10">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #a56300" transform="translate(639.595406 254.475798)">Split-class weight</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #a56300" transform="translate(589.92525 282.319548)">Same chunks + ordered fold</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #a56300" transform="translate(670.38525 306.398767)">at every M</text>
   </g>
   <g id="text_11">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #2563eb" transform="translate(628.329938 376.695798)">Unsplit-class weight</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #2563eb" transform="translate(608.084156 402.795798)">Same uninterrupted fold</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #2563eb" transform="translate(670.38525 428.618767)">at every M</text>
   </g>
   <g id="text_12">
    <text style="font-size: 17.25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312b" x="718.344" y="482.335323" transform="rotate(-0 718.344 482.335323)">Low-concurrency decode →</text>
   </g>
   <g id="text_13">
    <text style="font-size: 17.25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312b" x="718.344" y="508.176123" transform="rotate(-0 718.344 508.176123)">high-concurrency decode → prefill</text>
   </g>
   <g id="text_14">
    <text style="font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #617069" x="718.344" y="539.604123" transform="rotate(-0 718.344 539.604123)">Tune placement within the selected class.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 16.5px; font-family: 'DejaVu Sans'; fill: #365c20" transform="translate(173.545453 620.192992)">Schematic boundary. The exact policy also enforces granule alignment,</text>
    <text style="font-size: 16.5px; font-family: 'DejaVu Sans'; fill: #365c20" transform="translate(339.478734 644.117992)">chunk length, and traffic limits.</text>
   </g>
