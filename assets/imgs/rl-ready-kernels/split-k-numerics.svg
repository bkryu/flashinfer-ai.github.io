   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312b" x="37.404" y="39.4992" transform="rotate(-0 37.404 39.4992)">Split-K changes where accumulation restarts</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #617069" x="37.404" y="70.2288" transform="rotate(-0 37.404 70.2288)">The same dot-product terms can produce different bits, even with an ordered fixup.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #617069" x="44.388" y="117.0216" transform="rotate(-0 44.388 117.0216)">Illustrative FP32 accumulation: x = 2²⁵; terms along K are [x, 1, −x, 1].</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563eb" x="44.388" y="156.132" transform="rotate(-0 44.388 156.132)">Large M: one uninterrupted accumulator</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(81.987914 212.451142)">+ x</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(81.987914 230.420869)">= x</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(260.079914 213.434541)">+ 1</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(260.079914 230.420869)">= x</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(426.883828 212.795869)">+ (−x)</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(438.171914 231.552705)">= 0</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(616.263914 213.434541)">+ 1</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(616.263914 231.559541)">= 1</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #617069" x="44.388" y="274.1616" transform="rotate(-0 44.388 274.1616)">Start at +0; the first +1 is rounded away.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #2563eb" transform="translate(760.882688 213.71415)">1  ·  0x3f80</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #2563eb" transform="translate(758.268938 229.845712)">BF16 output</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a56300" x="44.388" y="319.5576" transform="rotate(-0 44.388 319.5576)">Small M: two independently accumulated chunks</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(146.83357 378.271747)">chunk 0: [x, 1]</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(165.647047 397.073505)">+0 → x → x</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(534.174875 378.271747)">chunk 1: [−x, 1]</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans Mono'; fill: #24312b" transform="translate(549.225656 397.073505)">+0 → −x → −x</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans Mono'; text-anchor: middle; fill: #24312b" x="398.826" y="483.15165" transform="rotate(-0 398.826 483.15165)">fixup: (+0 + x) + (−x) = 0</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #a56300" transform="translate(759.177375 475.508213)">0  ·  0x0000</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #a56300" transform="translate(758.268938 491.745713)">BF16 output</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #365c20" x="459.936" y="560.67405" transform="rotate(-0 459.936 560.67405)">Both paths are deterministic. Choosing the reduction by M breaks batch invariance.</text>
   </g>
  </g>
 </g>
